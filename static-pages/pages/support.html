<h1 class="font-serif font-bold text-4xl text-blue-900">Support</h1>
<p class="mt-3 text-slate-600">Report corrections, request new parishes, or ask for help.</p>

<section class="mt-10 bg-white rounded-3xl border border-slate-200 p-8">
  <div class="flex flex-col md:flex-row gap-4 md:items-center md:justify-between">
    <div>
      <h2 class="text-xl font-bold">WhatsApp</h2>
      <p class="mt-1 text-slate-700">Message Theo directly.</p>
